name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_REF" != "$expected" ]; then
            echo "Release tag $RELEASE_REF does not match package version $expected"
            exit 1
          fi
          echo "RELEASE_REF=$RELEASE_REF" >> "$GITHUB_ENV"

      - name: Run checks
        run: |
          pnpm fmt:check
          pnpm lint
          node --test test/cli.test.js

      - name: Test generated projects
        run: pnpm test:smoke

      - name: Publish package
        run: |
          package="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "$package" version >/dev/null 2>&1; then
            echo "$package is already published"
          else
            npm publish --access public --ignore-scripts
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_REF" >/dev/null 2>&1; then
            gh release create "$RELEASE_REF" --verify-tag --generate-notes --title "$RELEASE_REF"
          fi
